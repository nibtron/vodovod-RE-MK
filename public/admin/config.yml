backend:
  name: github
  repo: nibtron/vodovod-RE-MK
  branch: main
  base_url: https://vodovod-reports-auth.vodovod-reports-auth.workers.dev
  auth_endpoint: /auth

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: reports
    label: Poročila
    label_singular: Poročilo
    folder: src/data/reports
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.year}}-{{slug}}"
    summary: "{{year}} — {{title}}"
    sortable_fields:
      - year
      - title
    fields:
      - name: title
        label: Naslov poročila
        widget: string
        required: true
        hint: "Na primer: Analiza oktober ali Letno poročilo."
      - name: year
        label: Leto
        widget: number
        value_type: int
        min: 2000
        max: 2100
        required: true
        hint: "Izberite leto, ki bo prikazano pri poročilu na spletni strani."
      - name: pdf
        label: Datoteka PDF
        widget: file
        required: true
        choose_url: false
        hint: "Naložite PDF datoteko, veliko največ 20 MB."
        pattern:
          - ".*\\.pdf$"
          - Izberite datoteko PDF.
        media_library:
          config:
            max_file_size: 20971520
