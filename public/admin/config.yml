backend:
  name: github
  repo: nibtron/vodovod-RE-MK
  branch: main
  base_url: https://vodovod-reports-auth.vodovod-reports-auth.workers.dev
  auth_endpoint: /auth

publish_mode: simple
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: reports
    label: Poročila po letih
    label_singular: Leto poročil
    editor:
      preview: false
    folder: src/data/report-years
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    sortable_fields:
      - title
    fields:
      - name: title
        label: Leto
        widget: string
        required: true
        pattern:
          - "^(20[0-9]{2}|2100)$"
          - Vnesite leto med 2000 in 2100.
        hint: "Leto, v katerem bodo objavljena spodnja poročila, na primer 2027."
      - name: reports
        label: Poročila v tem letu
        label_singular: Poročilo
        widget: list
        default: []
        collapsed: true
        summary: "{{fields.title}}"
        add_to_top: true
        hint: "Dodajte poročilo, vnesite naslov in izberite PDF. Za urejanje obstoječega poročila kliknite puščico ob naslovu."
        fields:
          - name: title
            label: Naslov poročila
            widget: string
            required: true
            hint: "Na primer: Analiza oktober ali Letno poročilo."
          - name: pdf
            label: Datoteka PDF
            widget: file
            required: true
            choose_url: false
            hint: "Naložite PDF datoteko, veliko največ 20 MB."
            pattern:
              - ".*\\.pdf$"
              - Izberite datoteko PDF.
            media_library:
              config:
                max_file_size: 20971520
